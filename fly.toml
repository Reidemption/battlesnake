app = "CHANGE-ME"
primary_region = "sea"

[build]

[http_service]
internal_port = 8080
force_https = true
# A cold start blows the 500ms move deadline and the engine substitutes a default move,
# so the machine has to stay warm even while idle.
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
